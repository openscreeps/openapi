        value:
          $ref: "#/components/schemas/JsonValue"
          description: JSON value to assign. Omitted deletes the value at `path`; with no `path`, every Memory
            key is deleted and an object value is merged in. Serialized size limit 1 MiB.
        shard:
          allOf:
            - $ref: "#/components/schemas/ShardName"
          description: screeps.com shard whose runtime data is addressed (the official client refuses to call
            screeps.com without one). OpenScreeps and backend-local ignore it.
    UserMessage:
      type: object
      description: One copy of a private message. Each send creates an `out` copy owned by the sender and
        an `in` copy owned by the recipient.
      properties:
        _id:
          type: string
        user:
          allOf:
            - $ref: "#/components/schemas/UserId"
          description: Owner of this copy.
        respondent:
          allOf:
            - $ref: "#/components/schemas/UserId"
          description: The other participant.
        date:
          description: Send time. screeps.com/backend-local serialize a Date (ISO 8601 string, as typed by the
            official client); OpenScreeps returns Unix milliseconds.
          anyOf:
            - type: string
              format: date-time
            - type: integer
        type:
          type: string
          enum:
            - in
            - out
        text:
          type: string
          maxLength: 102400
        unread:
          type: boolean
        outMessage:
          type: string
          description: "On `in` copies: id of the sender's matching `out` copy."
      required:
        - _id
        - date
        - type
        - text
        - unread
