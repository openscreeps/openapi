        token:
          $ref: "#/components/schemas/AuthQueryTokenResult"
      required:
        - ok
        - _id
        - token
    AuthQueryTokenResult:
      type: object
      properties:
        full:
          type: boolean
          description: True if the token may call every endpoint; otherwise `endpoints`/`websockets` list the
            permitted ones.
        endpoints:
          type: array
          items:
            type: string
          description: Permitted REST endpoints, e.g. `GET /api/user/name`.
        websockets:
          type: array
          items:
            type: string
          description: Permitted WebSocket channel groups, e.g. `WebSockets (console)`.
        token:
          type: string
        description:
          type: string
          description: Name supplied when the token was generated.
      required:
        - full
        - token
    AuthSigninRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          description: E-mail address or (OpenScreeps) username; a value containing `@` is looked up as an
            e-mail, otherwise case-insensitively as a username.
        password:
          type: string
          description: "Local password (OpenScreeps: 8-1024 characters when set)."
      required:
        - email
        - password
    AuthSigninResponse:
      type: object
      properties:
        ok:
          type: integer
          const: 1
          description: "Success marker; every JSON success body carries `ok: 1`."
        token:
          type: string
          description: Session token to send as `X-Token`. OpenScreeps tokens are 64 lowercase hex characters,
            valid for `tokenLifetimeMs` (60 s default) and refreshed through the `X-Token` response
            header of authenticated calls.
      required:
        - ok
        - token
    AuthSteamAccount:
      type: object
      description: Linked Steam account data of the signed-in player (empty object on OpenScreeps when no
        Steam account is linked).
      properties:
        id:
          type: string
          pattern: ^[0-9]{1,20}$
          description: 64-bit SteamID as a decimal string.
        displayName:
          type: string
        ownership:
          anyOf:
            - type: boolean
            - type: array
              items:
                type: integer
                minimum: 0
          description: OpenScreeps/backend-local use a Steam ownership flag. Observed official responses use
            an array of owned Steam application IDs.
        steamProfileLinkHidden:
          description: Whether the Steam profile link is hidden from other players. backend-local stores 0/1
            (official client types `0 | 1`); OpenScreeps stores a boolean.
          anyOf:
            - type: boolean
            - type: integer
              enum:
                - 0
                - 1
    AuthSteamTicketRequest:
      type: object
      properties:
        ticket:
          type: string
          description: Hex-encoded Steam session ticket (`GetAuthSessionTicket`). OpenScreeps accepts 1-8192
            hex characters.
        useNativeAuth:
          type: boolean
          description: Request Greenworks encrypted app-ticket verification. OpenScreeps never supports it and
            rejects any truthy value.
      required:
        - ticket
    AuthSteamTicketResponse:
      type: object
      properties:
        ok:
          type: integer
          const: 1
          description: "Success marker; every JSON success body carries `ok: 1`."
        token:
          type: string
          description: Session token for `X-Token`.
        steamid:
          type: string
          pattern: ^[0-9]{1,20}$
          description: 64-bit SteamID as a decimal string.
      required:
        - ok
        - token
    EmptySuccess:
      type: object
      properties:
        ok:
          type: integer
          const: 1
      required:
        - ok
      additionalProperties: true
    GameAddGlobalIntentRequest:
      type: object
      required:
        - name
      description: "One account-level (global) intent. The server wraps `intent` in a one-element list and
        sanitizes it with the engine intent table: known names keep only their schema fields,
        unknown names store nothing. The global processor acts on market (`createOrder`,
        `changeOrderPrice`, `extendOrder`, `cancelOrder`, `deal`) and power-creep
        (`spawnPowerCreep`, `suicidePowerCreep`, `deletePowerCreep`, `upgradePowerCreep`,
        `createPowerCreep`, `renamePowerCreep`) intents; other known names are sanitized and queued
        but have no global effect. `generatePixel`, `unlockCpu` and `activateAccess` are dropped on
        OpenScreeps and unknown to the pinned backend. backend-local additionally accepts
        mod-registered `customIntentTypes`."
      properties:
        name:
          type: string
          examples:
            - createOrder
            - changeOrderPrice
            - extendOrder
            - cancelOrder
            - deal
            - spawnPowerCreep
            - suicidePowerCreep
            - deletePowerCreep
            - upgradePowerCreep
            - createPowerCreep
            - renamePowerCreep
        intent:
          description: Single payload object for the named intent (queued as one list element). Extra fields
            are allowed and discarded.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        shard:
          allOf:
            - $ref: "#/components/schemas/ShardName"
          description: Official shard routing. The official client sends `shard` inside the JSON body for POST
            operations; OpenScreeps is single-world and ignores it.
      allOf:
        - if:
            properties:
              name:
                const: createOrder
            required:
              - name
          then:
            properties:
              intent:
                anyOf:
                  - $ref: "#/components/schemas/GameIntentCreateOrder"
                  - type: "null"
        - if:
            properties:
              name:
                const: changeOrderPrice
            required:
              - name
          then:
            properties:
              intent:
                anyOf:
                  - $ref: "#/components/schemas/GameIntentChangeOrderPrice"
                  - type: "null"
        - if:
            properties:
              name:
                const: extendOrder
            required:
              - name
          then:
            properties:
              intent:
                anyOf:
                  - $ref: "#/components/schemas/GameIntentExtendOrder"
                  - type: "null"
        - if:
            properties:
              name:
                const: cancelOrder
            required:
              - name
          then:
            properties:
              intent:
                anyOf:
                  - $ref: "#/components/schemas/GameIntentCancelOrder"
                  - type: "null"
        - if:
            properties:
              name:
                const: deal
            required:
              - name
          then:
            properties:
              intent:
                anyOf:
                  - $ref: "#/components/schemas/GameIntentDeal"
                  - type: "null"
        - if:
            properties:
              name:
                const: spawnPowerCreep
            required:
              - name
          then:
            properties:
              intent:
                anyOf:
                  - $ref: "#/components/schemas/GameIntentSpawnPowerCreep"
                  - type: "null"
        - if:
            properties:
              name:
                const: suicidePowerCreep
            required:
              - name
          then:
            properties:
              intent:
                anyOf:
                  - $ref: "#/components/schemas/GameIntentSuicidePowerCreep"
                  - type: "null"
        - if:
            properties:
              name:
                const: deletePowerCreep
            required:
              - name
          then:
            properties:
              intent:
                anyOf:
                  - $ref: "#/components/schemas/GameIntentDeletePowerCreep"
                  - type: "null"
        - if:
            properties:
              name:
                const: upgradePowerCreep
            required:
              - name
          then:
            properties:
              intent:
                anyOf:
                  - $ref: "#/components/schemas/GameIntentUpgradePowerCreep"
                  - type: "null"
        - if:
            properties:
              name:
                const: createPowerCreep
            required:
              - name
          then:
            properties:
              intent:
                anyOf:
                  - $ref: "#/components/schemas/GameIntentCreatePowerCreep"
                  - type: "null"
        - if:
            properties:
              name:
                const: renamePowerCreep
            required:
              - name
          then:
            properties:
              intent:
                anyOf:
                  - $ref: "#/components/schemas/GameIntentRenamePowerCreep"
                  - type: "null"
        - if:
            properties:
              name:
                const: generatePixel
            required:
              - name
          then:
            properties:
              intent:
                anyOf:
                  - $ref: "#/components/schemas/GameIntentGeneratePixel"
                  - type: "null"
        - if:
            properties:
              name:
                const: unlockCpu
            required:
              - name
          then:
            properties:
              intent:
                anyOf:
                  - $ref: "#/components/schemas/GameIntentUnlockCpu"
                  - type: "null"
        - if:
            properties:
              name:
                const: activateAccess
            required:
              - name
          then:
            properties:
              intent:
                anyOf:
                  - $ref: "#/components/schemas/GameIntentActivateAccess"
                  - type: "null"
    GameAddObjectIntentRequest:
      type: object
      required:
        - _id
        - room
        - name
      description: Manual intent for one room object (or the room itself). The engine sanitizer keeps only
        the fields of the named intent; the `if`/`then` branches bind `intent` to that payload
        schema. Unknown intent names are accepted but store an empty intent record (no effect).
      properties:
        _id:
          type: string
          description: Target room object id, or the literal `room` for room-level intents (`createFlag`,
            `removeFlag`, `createConstructionSite`, `removeConstructionSite`, `destroyStructure`,
            which the room processor iterates as lists).
        room:
          $ref: "#/components/schemas/RoomName"
        name:
          type: string
          description: Intent name from the engine intent table.
          examples:
            - suicide
            - unclaim
            - destroyStructure
            - removeConstructionSite
            - activateSafeMode
            - notifyWhenAttacked
        intent:
          description: "Intent payload. `null`/absent stores nothing. On OpenScreeps an array is accepted only
            when `_id` is `room`; room-level list intents (`_id: room` with one of the five list
            names) must be arrays whose items are objects with `roomName` equal to `room`; null
            array items are rejected (`invalid params`). The official client types this parameter as
            a JSON string, but its documented examples send objects and arrays."
          anyOf:
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: "null"
        shard:
          allOf:
            - $ref: "#/components/schemas/ShardName"
          description: Official shard routing. The official client sends `shard` inside the JSON body for POST
            operations; OpenScreeps is single-world and ignores it.
      allOf:
        - if:
            properties:
              name:
                const: notify
            required:
              - name
          then:
            properties:
              intent:
                anyOf:
                  - $ref: "#/components/schemas/GameIntentNotify"
                  - type: array
                    items:
                      $ref: "#/components/schemas/GameIntentNotify"
                  - type: "null"
        - if:
            properties:
              name:
                const: createConstructionSite
            required:
              - name
          then:
            properties:
              intent:
                anyOf:
                  - $ref: "#/components/schemas/GameIntentCreateConstructionSite"
                  - type: array
                    items:
                      $ref: "#/components/schemas/GameIntentCreateConstructionSite"
                  - type: "null"
        - if:
            properties:
              name:
                const: createFlag
            required:
              - name
          then:
            properties:
              intent:
                anyOf:
                  - $ref: "#/components/schemas/GameIntentCreateFlag"
                  - type: array
                    items:
                      $ref: "#/components/schemas/GameIntentCreateFlag"
                  - type: "null"
        - if:
            properties:
              name:
                const: destroyStructure
            required:
              - name
          then:
            properties:
              intent:
                anyOf:
                  - $ref: "#/components/schemas/GameIntentDestroyStructure"
                  - type: array
                    items:
                      $ref: "#/components/schemas/GameIntentDestroyStructure"
                  - type: "null"
        - if:
            properties:
              name:
                const: removeConstructionSite
            required:
              - name
          then:
            properties:
              intent:
                anyOf:
                  - $ref: "#/components/schemas/GameIntentRemoveConstructionSite"
                  - type: array
                    items:
                      $ref: "#/components/schemas/GameIntentRemoveConstructionSite"
                  - type: "null"
