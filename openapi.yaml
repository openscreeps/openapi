    GameBuildableStructureType:
      type: string
      enum:
        - spawn
        - extension
        - road
        - constructedWall
        - rampart
        - link
        - storage
        - tower
        - observer
        - powerSpawn
        - extractor
        - lab
        - terminal
        - container
        - nuker
        - factory
      description: Keys of the engine `CONSTRUCTION_COST` table; any other value (including `controller`,
        which the official client lists as buildable) is rejected with `invalid params`.
    GameChangeFlagColorRequest:
      type: object
      required:
        - name
        - color
        - secondaryColor
      properties:
        room:
          allOf:
            - $ref: "#/components/schemas/RoomName"
          description: Room holding the flag. Required for any effect on OpenScreeps and backend-local
            (without it nothing is saved yet the call succeeds). The official client does not send
            it.
        name:
          type: string
        color:
          $ref: "#/components/schemas/GameFlagColor"
        secondaryColor:
          $ref: "#/components/schemas/GameFlagColor"
        shard:
          allOf:
            - $ref: "#/components/schemas/ShardName"
          description: Official shard routing. The official client sends `shard` inside the JSON body for POST
            operations; OpenScreeps is single-world and ignores it.
    GameCheckUniqueFlagNameRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        shard:
          allOf:
            - $ref: "#/components/schemas/ShardName"
          description: Official shard routing. The official client sends `shard` inside the JSON body for POST
            operations; OpenScreeps is single-world and ignores it.
    GameCheckUniqueObjectNameRequest:
      type: object
      required:
        - type
        - name
      properties:
        type:
          type: string
          enum:
            - spawn
        name:
          type: string
        shard:
          allOf:
            - $ref: "#/components/schemas/ShardName"
          description: Official shard routing. The official client sends `shard` inside the JSON body for POST
            operations; OpenScreeps is single-world and ignores it.
    GameControllerSign:
      type: object
      description: Controller sign (`controller.sign`).
      properties:
        user:
          $ref: "#/components/schemas/UserId"
        text:
          type: string
        time:
          type: integer
          description: Game tick of signing.
        datetime:
          type: number
          description: Wall-clock UNIX time in milliseconds.
        endDatetime:
          type: number
          description: Only on system (hard) signs per the official client.
      required:
        - text
        - time
        - datetime
      additionalProperties: true
    GameCoordinateInput:
      description: Room tile coordinate (0..49) as accepted by `parseInt`-style decoding. OpenScreeps
        (`parseInteger`) truncates JSON numbers and parses numeric strings with
        `Number.parseInt(value, 10)`; any other JSON type becomes `NaN` and is rejected with
        `invalid params`. backend-local applies `parseInt` to the raw value.
      anyOf:
        - type: integer
          minimum: 0
          maximum: 49
        - type: string
          pattern: ^\s*[+-]?[0-9]+
          description: Numeric string; only the leading integer is used.
    GameCreateConstructionRequest:
      type: object
      required:
        - room
        - x
        - y
        - structureType
      properties:
        room:
          $ref: "#/components/schemas/RoomName"
        x:
          $ref: "#/components/schemas/GameCoordinateInput"
        y:
          $ref: "#/components/schemas/GameCoordinateInput"
        structureType:
          $ref: "#/components/schemas/GameBuildableStructureType"
        name:
          type: string
          maxLength: 50
          description: Required (non-empty) when `structureType` is `spawn`; otherwise optional. A non-string
            truthy value yields `invalid params`.
        shard:
          allOf:
            - $ref: "#/components/schemas/ShardName"
          description: Official shard routing. The official client sends `shard` inside the JSON body for POST
            operations; OpenScreeps is single-world and ignores it.
    GameCreateConstructionResponse:
      allOf:
        - $ref: "#/components/schemas/Ok"
        - type: object
          properties:
            _id:
              type: string
              description: Id of the new construction site (OpenScreeps and backend-local).
            result:
              type: object
              properties:
                ok:
                  type: integer
                n:
                  type: integer
              additionalProperties: true
              description: Official client typing only.
            ops:
              type: array
              items:
                $ref: "#/components/schemas/GameRoomObject"
              description: Inserted construction-site documents; official client typing only.
            insertedCount:
              type: integer
              description: Official client typing only.
            insertedIds:
              type: array
              items:
                type: string
              description: Official client typing only.
          additionalProperties: true
