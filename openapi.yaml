      summary: Read standalone room-history chunk
      description: OpenScreeps returns timestamp, room, base and contiguous tick-keyed object diffs,
        without the usual ok wrapper. An object id maps to a new object, partial update, or null
        deletion. time must identify a retained frame; at most historyChunkSize frames are returned.
        Unlike the official static-history path, this route uses query parameters.
