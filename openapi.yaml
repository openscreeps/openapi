        not valid` (levels not reachable in requirement order), `not enough power level`
        (insufficient free GPL). Mutation: merges `{level}` into each non-zero power (keeping
        cooldowns) and sets `level`, `hitsMax = 1000 × (level + 1)` and `storeCapacity = 100 ×
        (level + 1)` on the record and, when spawned, on its room object. Not called by the official
        client; screeps.com support is unverified."
