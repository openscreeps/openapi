        gid:
          type: string
        title:
          type: string
        url:
          type: string
        is_external_url:
          type: boolean
        author:
          type: string
        contents:
          type: string
        feedlabel:
          type: string
        date:
          type: integer
        feedname:
          type: string
        feed_type:
          type: integer
        appid:
          type: integer
      required: []
      additionalProperties: true
    PlatformNuke:
      type: object
      properties:
        _id:
          type: string
        type:
