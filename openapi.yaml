      description: A user's ranking in one season.
      properties:
        _id:
          type: string
          description: "Result id (OpenScreeps: `<season>-<mode>-<userId>`)."
        season:
          $ref: "#/components/schemas/LeaderboardSeasonId"
        user:
          $ref: "#/components/schemas/UserId"
        score:
          type: number
        rank:
          type: integer
          minimum: 0
          description: Position in the season ranking. OpenScreeps ranks from 0 (best), ties broken by user
            id; zero scores are unranked.
      required:
        - _id
        - season
        - user
        - score
        - rank
    LeaderboardSeason:
      type: object
      properties:
        _id:
          type: string
          description: Season id `YYYY-MM` (backend-local returns placeholder ids `empty1`/`empty2`).
        name:
          type: string
          description: Display name, e.g. `October 2026`.
        date:
          type: string
          format: date-time
          description: Season start (UTC). Omitted by backend-local.
      required:
        - _id
        - name
    LeaderboardSeasonId:
      type: string
      pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      description: Monthly leaderboard season `YYYY-MM` (UTC); unrelated to Seasonal World competitions.
    LeaderboardSeasonsResponse:
      type: object
      properties:
        ok:
          type: integer
          const: 1
          description: "Success marker; every JSON success body carries `ok: 1`."
        seasons:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardSeason"
          description: Newest first; the first entry is the current season.
      required:
        - ok
        - seasons
    LeaderboardUser:
      type: object
      description: Public user data of a listed result. OpenScreeps also includes `gcl`.
      properties:
        _id:
          $ref: "#/components/schemas/UserId"
        username:
          type: string
        badge:
          $ref: "#/components/schemas/UserBadge"
        gcl:
          type: number
      required:
        - _id
    MarketMyOrdersResponse:
      anyOf:
        - allOf:
            - $ref: "#/components/schemas/Ok"
            - type: object
              properties:
                list:
                  type: array
                  items:
                    $ref: "#/components/schemas/MarketOrder"
              additionalProperties: true
              required:
                - list
          description: "OpenScreeps/backend-local: every order (active or not) owned by the caller."
        - allOf:
            - $ref: "#/components/schemas/Ok"
            - type: object
              properties:
                shards:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      $ref: "#/components/schemas/MarketOrder"
                  description: Orders keyed by shard name; intershard orders under `intershard`.
              additionalProperties: true
              required:
                - shards
          description: Official shape as implied by the official client (`mapToShard` only synthesizes
            `shards` when absent, and documents intershard orders under the `intershard` key).
    MarketOrder:
      type: object
      description: Market order document. `price` is converted from stored thousandths to credits;
        OpenScreeps drops processing-only `_`-prefixed fields except `_id`. The official client
        types public orders without `_id`/`user`/`active`.
      properties:
        _id:
          type: string
        created:
          type: integer
          description: Game tick of creation.
        createdTimestamp:
          type: number
          description: UNIX time in milliseconds of creation.
        user:
          type:
            - string
            - "null"
          description: Owner user id (null for NPC orders).
        active:
          type: boolean
        type:
          type: string
          enum:
            - buy
            - sell
        amount:
          type: integer
        remainingAmount:
          type: integer
        totalAmount:
          type: integer
        resourceType:
          type: string
        price:
          type: number
          description: Credits per unit.
        roomName:
          type: string
          description: Absent for intershard (account resource) orders on OpenScreeps.
      required:
        - type
        - resourceType
        - amount
        - remainingAmount
        - price
      additionalProperties: true
    MarketOrderIndexEntry:
      type: object
      description: Active-order summary of one resource type.
      properties:
        _id:
          type: string
          description: Resource type.
        count:
          type: integer
          description: Active orders.
        buying:
          type: integer
          description: Active buy orders (OpenScreeps/backend-local).
        selling:
          type: integer
          description: Active sell orders (OpenScreeps/backend-local).
        avgPrice:
          type: number
          description: Official client typing only.
        stdeevPrice:
          type: number
          description: Official client typing only (spelling as typed).
      required:
        - _id
        - count
      additionalProperties: true
    MarketOrdersIndexResponse:
      allOf:
        - $ref: "#/components/schemas/Ok"
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: "#/components/schemas/MarketOrderIndexEntry"
          additionalProperties: true
          required:
            - list
    MarketOrdersResponse:
      allOf:
        - $ref: "#/components/schemas/Ok"
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: "#/components/schemas/MarketOrder"
          additionalProperties: true
          required:
            - list
    MarketStatsEntry:
      type: object
      description: Daily price history of one resource (`market.stats`).
      properties:
        _id:
          type: string
        resourceType:
          type: string
        date:
          type: string
          format: date
          description: "`YYYY-MM-DD`."
        transactions:
          type: integer
        volume:
          type: number
        avgPrice:
          type: number
        stddevPrice:
          type: number
      required:
        - resourceType
        - date
        - transactions
        - volume
        - avgPrice
        - stddevPrice
      additionalProperties: true
    MarketStatsResponse:
      allOf:
        - $ref: "#/components/schemas/Ok"
        - type: object
          properties:
            stats:
              type: array
              items:
                $ref: "#/components/schemas/MarketStatsEntry"
              description: Newest date first.
          additionalProperties: true
          required:
            - stats
    Ok:
      type: object
      properties:
        ok:
          type: integer
          const: 1
      required:
        - ok
      additionalProperties: true
    PlatformHistory:
