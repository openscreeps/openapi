              type: string
              minLength: 1
              maxLength: 16
              pattern: ^[WE][0-9]{1,3}[NS][0-9]{1,3}$
            to:
              type: string
              minLength: 1
              maxLength: 16
              pattern: ^[WE][0-9]{1,3}[NS][0-9]{1,3}$
            options:
