  /room-history/{shard}/{room}/{tick}.json:
    get:
      operationId: platformOfficialRoomHistory
      summary: Read official room-history chunk
      description: Official static history route. The reference client rounds tick down to a 100-tick
        chunk boundary; inspect /api/version for the current historyChunkSize. History consists of
        an initial object state followed by tick-keyed diffs, not complete independent room
        snapshots. Missing/expired chunks return 404, potentially non-JSON from the static host.
      tags:
        - Platform
      security: []
      parameters:
        - name: shard
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ShardName"
          description: Shard name.
        - name: room
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RoomName"
          description: Room name.
        - name: tick
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
          description: First tick in the history chunk.
      responses:
        "200":
          description: Successful result or logical API failure. Inspect error even on HTTP 200.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/PlatformHistory"
                  - $ref: "#/components/schemas/ApiError"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: History chunk not found; a static hosting error body is not guaranteed to be JSON.
        "500":
          $ref: "#/components/responses/ServerError"
      x-availability:
        screeps-com: supported
        openscreeps: unsupported
      x-sources:
