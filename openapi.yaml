    post:
      operationId: powerCreepsUpgrade
      summary: Set power creep power levels
      description: "Sets the complete power levels of one of the caller's power creeps; the new creep
        level is the sum of power levels. Refusals: `invalid id`, `invalid powers` (not an object),
        `invalid power <id>`, `invalid class for power <id>`, `invalid value for power <id>` (not a
