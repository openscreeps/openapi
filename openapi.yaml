  /api/game/place-spawn:
    post:
      operationId: gamePlaceSpawn
      summary: Place the first spawn
      description: >-
        Starts playing: places the caller's first spawn at `x`,`y` in a free room. Preconditions
        (checked in this order on OpenScreeps): coordinates 0..49 and name ≤ 50 characters (`invalid
        params`), account not blocked (`blocked`), non-zero CPU (`no cpu`), at least 180 s since the
        last respawn (`too soon after last respawn`), playable room (The target room must exist, be
        a world room (`W…`/`E…`, otherwise `not supported`), and be inside the borders and open
        (`out of borders`). / `invalid room`), the caller owns no room objects (`already playing`),
        the controller exists (`invalid room`) and is unowned, unreserved and not bound to another
        user (`room busy`), and the tile is a valid construction spot (`invalid location`).
        Mutation: other players' creeps and construction sites in the room are removed, their
        structures become ruins (decaying after 100000 ticks), the level-0 controller is claimed at
        level 1 with 20000 ticks of safe mode, sources reset `invaderHarvested`, the spawn is
        inserted with 300 energy, the room's `invaderGoal` becomes 1000000, the room is activated,
        and the user's `active` counter becomes 10000. See `userWorldStatus` for the precondition
        state.


        On screeps.com, placing the initial spawn of an account has been observed to reset the
        account's CPU allocation to the selected shard; callers must not assume a previously
        configured allocation (`userCpuShardsSet`, `POST /api/user/cpu-shards`) survives.
        OpenScreeps is single-world and does not change CPU settings.
      tags:
        - Game
      security:
        - Token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GamePlaceSpawnRequest"
      responses:
        "200":
          description: "Spawn placed. Logical failures are reported with HTTP 200 and `{error}`: `invalid
            params`, `blocked`, `no cpu`, `too soon after last respawn`, `invalid room`, `not
            supported`, `out of borders`, `already playing`, `room busy`, `invalid location`."
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/GamePlaceSpawnResponse"
                  - $ref: "#/components/schemas/ApiError"
          headers:
            X-Token:
              description: Refreshed session token when issued by the server. Retain it for subsequent
                authenticated requests.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
