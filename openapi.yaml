components:
  securitySchemes:
    AdminToken:
      type: http
      scheme: bearer
      description: OpenScreeps administrator secret (at least 32 characters), distinct from all player
        tokens. Disabled unless SCREEPS_ADMIN_TOKEN is configured.
    Bearer:
      type: http
      scheme: bearer
      description: OpenScreeps player-session alternative to X-Token. Do not assume official servers accept it.
    Token:
      type: apiKey
      in: header
      name: X-Token
      description: Official API token or server-issued session token. OpenScreeps refreshes successful
        authenticated responses in X-Token; preserve rotated tokens. Never send tokens to untrusted
        hosts or follow authenticated cross-host redirects.
  parameters:
    LegacyUsername:
      name: X-Username
      in: header
      required: false
      schema:
        type: string
      description: Legacy Screeps API clients send the token value here as well as X-Token. OpenScreeps
        does not require this header.
    ServerPassword:
      name: X-Server-Password
      in: header
      required: false
      schema:
        type: string
      description: Required by OpenScreeps ApiGuard routes only when the host configures SERVER_PASSWORD;
        independent of player authentication. Missing/wrong value returns the API error envelope,
        usually HTTP 200.
    Shard:
      name: shard
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ShardName"
      description: Official shard routing where the operation accepts it. OpenScreeps serves one world;
        this field does not select a different world.
  responses:
    BadRequest:
      description: Invalid HTTP input.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RateLimited:
      description: Request limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServerError:
      description: Server failed to process the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Success:
      description: Success or a logical API failure; inspect the body even when HTTP status is 200.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/Ok"
              - $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Missing, expired or invalid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    AdminBotOptions:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[a-zA-Z0-9_-]{3,}$
        cpu:
          type: integer
          minimum: 1
          maximum: 10000
        gcl:
          type: integer
          minimum: 1
          maximum: 100
        x:
          type: integer
          minimum: 1
          maximum: 48
        y:
          type: integer
          minimum: 1
          maximum: 48
      required: []
      additionalProperties: false
    AdminCommand:
      oneOf:
        - type: object
          properties:
            action:
              type: string
              const: status
          required:
            - action
          additionalProperties: false
          description: Read the same world/operator status returned by GET /admin/status.
        - type: object
          properties:
            action:
              type: string
              const: pause
          required:
            - action
          additionalProperties: false
          description: Pause automatic ticks.
        - type: object
          properties:
            action:
              type: string
              const: resume
          required:
            - action
          additionalProperties: false
          description: Resume automatic ticks.
        - type: object
          properties:
            action:
              type: string
              const: tick
            count:
              type: integer
              minimum: 1
              maximum: 1000
              default: 1
          required:
            - action
          additionalProperties: false
          description: Advance 1–1000 real world ticks; returns completed tick count and game time.
        - type: object
          properties:
            action:
              type: string
              const: tick-duration
            milliseconds:
              type: integer
              minimum: 1
              maximum: 3600000
          required:
            - action
            - milliseconds
          additionalProperties: false
          description: Set milliseconds between automatic ticks.
        - type: object
          properties:
            action:
              type: string
              const: user-create
            username:
              type: string
              minLength: 3
              maxLength: 64
              pattern: ^[a-zA-Z0-9_-]{3,}$
            password:
              type: string
              minLength: 8
              maxLength: 1024
              writeOnly: true
            email:
              type: string
              minLength: 1
              maxLength: 254
              pattern: ^[\w.+&-]+@[\w.&-]+\.[\w.&-]{2,}$
            steamId:
              type: string
              minLength: 1
              maxLength: 20
              pattern: ^[0-9]{1,20}$
            cpu:
              type: integer
              minimum: 0
              maximum: 10000
            gcl:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            cpuAvailable:
              type: integer
              minimum: 0
              maximum: 10000
          required:
            - action
            - username
          additionalProperties: false
          description: Create a player. gcl is raw control progress, not a room-count level. Username/account
            constraints also apply.
        - type: object
          properties:
            action:
              type: string
              const: user-update
            userId:
              type: string
              minLength: 1
              maxLength: 64
            username:
              type: string
              minLength: 1
              maxLength: 64
            password:
              type: string
              minLength: 8
              maxLength: 1024
              writeOnly: true
            cpu:
              type: integer
              minimum: 0
              maximum: 10000
            gcl:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            power:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            credits:
              type: number
              minimum: 0
              maximum: 1000000000000
            active:
              type: boolean
            resources:
              type: object
              description: Only INTERSHARD_RESOURCES names accepted by the pinned engine. Zero removes an entry;
                others set the amount.
              propertyNames:
                enum:
                  - token
                  - cpuUnlock
                  - pixel
                  - accessKey
              additionalProperties:
                type: integer
                minimum: 0
                maximum: 9007199254740991
          required:
            - action
          additionalProperties: false
          description: Update one non-system player selected by exactly one of userId or username. At least
            one changed field required. Credits are rounded to thousandths; gcl and power are raw
            progress totals. Zero resource amounts delete those entries.
          oneOf:
            - properties:
                userId:
                  type: string
                  minLength: 1
                  maxLength: 64
              required:
                - userId
            - properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 64
              required:
                - username
          minProperties: 3
        - type: object
          properties:
            action:
              type: string
              const: user-remove
            userId:
              type: string
              minLength: 1
              maxLength: 64
            username:
              type: string
              minLength: 1
              maxLength: 64
          required:
            - action
          additionalProperties: false
          description: "Destructive: remove player world state, credentials, sessions and server-private
            account records; revoke authentication. NPC/system accounts are protected."
          oneOf:
            - properties:
                userId:
                  type: string
                  minLength: 1
                  maxLength: 64
              required:
                - userId
            - properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 64
              required:
                - username
        - type: object
          properties:
            action:
              type: string
              const: room-generate
            room:
              type: string
              minLength: 1
              maxLength: 16
              pattern: ^[WE][0-9]{1,3}[NS][0-9]{1,3}$
            options:
              $ref: "#/components/schemas/AdminGenerateOptions"
          required:
            - action
            - room
          additionalProperties: false
          description: Generate a room and terrain; reject invalid domain geometry/options.
        - type: object
          properties:
            action:
              type: string
              const: room-open
            room:
              type: string
              minLength: 1
              maxLength: 16
              pattern: ^[WE][0-9]{1,3}[NS][0-9]{1,3}$
            openTime:
              type: integer
              minimum: 0
              maximum: 8640000000000000
          required:
            - action
            - room
          additionalProperties: false
          description: Open a room now or at the given Unix-millisecond timestamp.
        - type: object
          properties:
            action:
              type: string
              const: room-close
            room:
              type: string
              minLength: 1
              maxLength: 16
              pattern: ^[WE][0-9]{1,3}[NS][0-9]{1,3}$
          required:
            - action
            - room
          additionalProperties: false
          description: Close a room.
        - type: object
          properties:
            action:
              type: string
              const: room-remove
            room:
              type: string
              minLength: 1
              maxLength: 16
              pattern: ^[WE][0-9]{1,3}[NS][0-9]{1,3}$
          required:
            - action
            - room
          additionalProperties: false
          description: "Destructive: remove a room from the world."
        - type: object
