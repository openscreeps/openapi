        visible:
          type: boolean
          description: Truthy shows the Steam profile link in public profiles; falsy hides it.
    UserStatInterval:
      type: integer
      enum:
        - 8
        - 180
        - 1440
      description: "Minutes per statistics slot: 8 (8 slots, about an hour), 180 (8 slots, a day), 1440 (7
        slots on OpenScreeps/backend-local; the official client describes 8 days)."
    UserStatsResponse:
      type: object
      properties:
        ok:
          type: integer
          const: 1
          description: "Success marker; every JSON success body carries `ok: 1`."
        stats:
          $ref: "#/components/schemas/UserRoomStatValues"
      required:
        - ok
        - stats
    UserTimestampResponse:
      type: object
      properties:
        ok:
          type: integer
          const: 1
          description: "Success marker; every JSON success body carries `ok: 1`."
        timestamp:
          type: integer
          description: Server wall-clock time of the change in Unix milliseconds (clone-branch on OpenScreeps
            returns the branch timestamp, the same clock).
      required:
        - ok
        - timestamp
      description: Success with the change timestamp.
    UserWorldStartRoomResponse:
      type: object
      properties:
        ok:
          type: integer
          const: 1
          description: "Success marker; every JSON success body carries `ok: 1`."
        room:
          type: array
          maxItems: 1
          items:
            type: string
            description: Room name (`W5N5`) or, on screeps.com when no `shard` was requested, `shard/room` (e.g.
              `shard3/W5N5`).
          description: Zero or one room names to center the map on.
      required:
        - ok
        - room
    UserWorldStatus:
      type: string
      enum:
        - empty
        - normal
        - lost
      description: "`empty`: no objects in the world (new or respawned, must place a spawn); `normal`:
        owns a spawn in a room whose controller it owns; `lost`: has objects but no such spawn (may
        respawn)."
    UserWorldStatusResponse:
      type: object
      properties:
        ok:
          type: integer
          const: 1
          description: "Success marker; every JSON success body carries `ok: 1`."
        status:
          $ref: "#/components/schemas/UserWorldStatus"
      required:
        - ok
        - status
