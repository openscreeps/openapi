    AuthMeResponse:
      type: object
      properties:
        ok:
          type: integer
          const: 1
          description: "Success marker; every JSON success body carries `ok: 1`."
        _id:
          $ref: "#/components/schemas/UserId"
        username:
          type: string
          description: Absent for accounts that have not chosen a username (OpenScreeps Steam sign-up before
            `register/set-username`).
        email:
          type: string
          description: Lower-cased account e-mail; absent when none is set.
        emailDirty:
          type: string
          description: Unconfirmed e-mail (backend-local/OpenScreeps projection; no OpenScreeps API writes it,
            so it appears only in imported state).
        cpu:
          type: number
          description: Total CPU per tick available to the account.
        cpuShard:
          type: object
          additionalProperties:
            type: number
          description: "screeps.com: per-shard CPU limits (`Game.cpu.shardLimits`). Not returned by
            OpenScreeps."
        cpuShardUpdatedTime:
          type: number
          description: "screeps.com: Unix ms of the last successful shard-limit change
            (`Game.cpu.setShardLimits()` or `POST /api/user/cpu-shards`). Not returned by
            OpenScreeps."
        badge:
          $ref: "#/components/schemas/UserBadge"
        password:
          type: boolean
          description: True when password sign-in is configured.
        lastRespawnDate:
          type: number
          description: Unix ms of the last respawn.
        notifyPrefs:
          $ref: "#/components/schemas/UserNotifyPrefs"
        gcl:
          type: number
          description: Lifetime control points.
        lastChargeTime:
          type: number
          description: Last subscription charge time (backend-local/OpenScreeps projection; no OpenScreeps API
            writes it).
        blocked:
          type: boolean
        customBadge:
          $ref: "#/components/schemas/UserBadgeCustomPaths"
        power:
          type: number
          description: Lifetime power processed.
        money:
          type: number
          description: Credit balance (stored thousandths divided by 1000).
        credits:
          description: screeps.com legacy field; the official client marks it deprecated and observes it
            always 0. Not returned by OpenScreeps.
        steam:
          $ref: "#/components/schemas/AuthSteamAccount"
        github:
          type: object
          description: screeps.com GitHub SSO data.
          properties:
            id:
              type: string
            username:
              type: string
        twitter:
          type: object
          description: screeps.com Twitter SSO data.
          properties:
            username:
              type: string
            followers_count:
              type: integer
        lastTweetTime:
          type: number
          description: screeps.com only.
        resources:
          type: object
          additionalProperties:
            type: number
          description: screeps.com account-bound resources (e.g. pixel, cpuUnlock, accessKey) and amounts.
        restrictedAccessUntil:
          description: screeps.com only; type not documented by the official client.
        powerExperimentations:
          type: integer
          description: Remaining power-creep experimentation periods.
        powerExperimentationTime:
          type: number
          description: Unix ms start of the last experimentation period (0 if never).
