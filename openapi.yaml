    post:
      operationId: userCpuShardsSet
      summary: Set per-shard CPU allocation
      description: "screeps.com only. Replaces the account's CPU allocation across shards
        (`Game.cpu.shardLimits`) with `cpu: {<shard>: limit}`. Observed: the limits must total the
        account CPU (omitted shards count as 0), and changes made too soon after the previous change
        are rejected (an interval of about 12 hours was observed; the exact cooldown and its error
        text are not documented). The new allocation is reflected in `GET /api/auth/me` (`cpuShard`,
        `cpuShardUpdatedTime`). Note that placing an initial spawn (`gamePlaceSpawn`) resets the
        allocation to the shard where the spawn was placed. The success body carries `ok: 1` plus
        database-driver metadata; only `ok` is stable. OpenScreeps has a single world with no shard
        CPU allocation and does not implement this route."
      tags:
        - User
      security:
        - Token: []
      requestBody:
