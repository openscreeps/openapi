                      $ref: "#/components/schemas/UserBadge"
                  additionalProperties: true
                - type: "null"
            stats:
              type: object
              description: Graph points per room stat, oldest first, summed over all players in the room
                (OpenScreeps). backend-local returns `{}`.
              propertyNames:
                $ref: "#/components/schemas/GameRoomStatName"
              additionalProperties:
                type: array
                items:
                  $ref: "#/components/schemas/GameStatPoint"
            statsMax:
              type: object
              description: Largest point per `<stat><interval>` key, at least 1 on OpenScreeps; `{}` on
                backend-local.
              additionalProperties:
                type: number
            totals:
              type: object
              description: Window total per room stat (OpenScreeps reports every stat including zeros; the
                official client documents zero totals as omitted).
              additionalProperties:
                type: number
