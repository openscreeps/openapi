  /assets/{path}:
    get:
      operationId: platformAsset
      summary: Read standalone client or terrain asset
      description: OpenScreeps wildcard asset route. map/W1N1.png renders room terrain at 150×150;
        map/zoom2/W0N0.png renders an aligned 4×4-room sector at 200×200. Other files come from the
        optional operator asset directory, with traversal and symlink containment checks. The path
        can contain slashes; some generated clients encode them, so preserve the wildcard path when
        using this endpoint. This specification does not claim that official assets use the same URL
        scheme.
