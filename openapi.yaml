          type: object
          properties:
            host:
              type: string
            port:
              type: string
            pass:
              type: string
          required:
            - host
            - port
            - pass
          additionalProperties: true
        name:
          type: string
        status:
          type: string
        likeCount:
          type: number
      required:
        - _id
        - settings
        - name
        - status
        - likeCount
      additionalProperties: true
    PlatformVersion:
      type: object
      properties:
        ok:
          type: integer
          const: 1
        protocol:
          type: integer
        package:
          type: integer
        databaseVersion:
          type: integer
        packageVersion:
          type: string
        useNativeAuth:
          type: boolean
        users:
          type: integer
        currentSeason:
          type: string
        decorationConvertationCost:
          type: number
        decorationPixelizationCost:
          type: number
        serverData:
          type: object
          properties:
            customObjectTypes:
              type: object
              additionalProperties: {}
            historyChunkSize:
              type: integer
            socketUpdateThrottle:
              type: number
            welcomeText:
              type: string
            renderer:
              type: object
              properties:
                resources:
                  type: object
                  additionalProperties: {}
                metadata:
                  type: object
                  additionalProperties: {}
              required:
                - resources
                - metadata
              additionalProperties: true
            features:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: number
                  menuData:
                    type: array
                    items:
                      type: object
                      properties:
                        section:
                          type: number
                        start:
                          type: number
                        after:
                          type: string
                        module:
                          type: string
                        item:
                          type: object
                          additionalProperties: {}
                      required:
                        - section
                        - item
                      additionalProperties: true
                required:
                  - name
                  - version
                additionalProperties: true
            shards:
              type: array
              items:
                type: string
          required:
            - customObjectTypes
            - historyChunkSize
            - renderer
          additionalProperties: true
      required:
        - ok
        - protocol
        - users
        - serverData
      additionalProperties: true
    PowerCreep:
      type: object
      description: "Power creep account record (`users.power_creeps`). While spawned, `/list` merges the
        creep's room object over it (adding `type: powerCreep`, `room`, `x`, `y`, `hits`,
        `ticksToLive`, `actionLog`, …)."
      properties:
        _id:
          type: string
        user:
          $ref: "#/components/schemas/UserId"
        name:
          type: string
          maxLength: 50
        className:
          type: string
          enum:
            - operator
        level:
          type: integer
          minimum: 0
          maximum: 25
        hitsMax:
          type: integer
        store:
          type: object
          additionalProperties:
            type: number
        storeCapacity:
          type: integer
        spawnCooldownTime:
          type:
            - number
            - "null"
          description: "`null` while spawned; otherwise the UNIX time (ms) before which it cannot spawn (0
            when never spawned)."
        deleteTime:
          type:
            - number
            - "null"
          description: UNIX time (ms) at which a scheduled deletion completes.
        shard:
          type:
            - string
            - "null"
          description: Shard the creep is spawned on.
        powers:
          type: object
          description: Power levels keyed by power id (`PWR_*` constant 1..19).
          propertyNames:
            pattern: ^[0-9]+$
          additionalProperties:
            $ref: "#/components/schemas/PowerCreepPowerLevel"
      required:
        - _id
        - user
        - name
        - className
        - level
        - hitsMax
        - store
        - storeCapacity
        - spawnCooldownTime
        - powers
      additionalProperties: true
    PowerCreepCreateRequest:
      type: object
      required:
        - className
        - name
      properties:
        className:
          type: string
          enum:
            - operator
          description: Value of `POWER_CLASS`; anything else yields `invalid class`.
        name:
          type: string
          maxLength: 50
          description: "Stored as `String(name).substring(0, 50)`: any JSON value is converted (an omitted
            name becomes the literal `undefined`)."
    PowerCreepCreateResponse:
      allOf:
        - $ref: "#/components/schemas/Ok"
        - $ref: "#/components/schemas/PowerCreep"
      description: "OpenScreeps returns `{ok: 1, ...creep}` (copy of the new record, `level: 0`, `hitsMax:
        1000`, `storeCapacity: 100`, `spawnCooldownTime: 0`, `powers: {}`); backend-local returns
        its storage insert result for the same record."
    PowerCreepIdRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: Power creep id owned by the caller.
    PowerCreepListResponse:
      allOf:
        - $ref: "#/components/schemas/Ok"
        - type: object
          properties:
            list:
              type: array
              items:
                $ref: "#/components/schemas/PowerCreep"
          additionalProperties: true
          required:
            - list
    PowerCreepPowerLevel:
      type: object
      properties:
        level:
          type: integer
          minimum: 0
          maximum: 5
        cooldownTime:
          type: integer
          description: Game tick until which the power is on cooldown (set by the engine).
      required:
        - level
      additionalProperties: true
    PowerCreepRenameRequest:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 50
          description: Stored as `String(name).substring(0, 50)`; any JSON value is converted.
    PowerCreepUpgradeRequest:
      type: object
      required:
        - id
        - powers
      properties:
        id:
          type: string
        powers:
          type: object
          description: Complete requested level per power id (missing powers count as level 0, so omitting a
            learned power is a downgrade and is refused). Only powers of the creep's class, levels
            0..5; the sum is the new creep level (max 25). OpenScreeps additionally rejects
            non-integer levels.
          propertyNames:
            pattern: ^[0-9]+$
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 5
    RegisterSetUsernameRequest:
      type: object
      properties:
        username:
          type: string
          pattern: ^[a-zA-Z0-9_-]{3,}$
          description: New unique (case-insensitive) username.
        email:
          type: string
          description: Optional e-mail stored lower-cased; must match the server e-mail rule.
      required:
        - username
    RegisterSubmitRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
        modules:
          $ref: "#/components/schemas/UserCodeModules"
      required:
        - username
        - email
        - password
    RoomName:
      type: string
      pattern: ^[WE][0-9]+[NS][0-9]+$
      examples:
        - W8N2
    ScoreboardListResponse:
      type: object
      properties:
        ok:
          type: integer
          const: 1
          description: "Success marker; every JSON success body carries `ok: 1`."
        meta:
          type: object
          properties:
            length:
              type: integer
              description: Total players in the result set.
          required:
            - length
        users:
          type: array
          items:
            $ref: "#/components/schemas/ScoreboardUser"
          description: Page ordered by rank ascending.
      required:
        - ok
        - meta
        - users
    ScoreboardUser:
      type: object
      properties:
        username:
          type: string
        badge:
          $ref: "#/components/schemas/UserBadge"
        rank:
          type: integer
          description: Current season rank; ties appear broken alphabetically.
        score:
          type: number
          description: Absent before the player scores.
      required:
        - username
        - badge
        - rank
    SeasonalWorldCompetition:
      type: object
      description: Seasonal World competition metadata (screeps.com).
      properties:
        _id:
          type: string
        title:
          type: string
          description: e.g. `Season 8`.
        index:
          type: integer
          description: Season ordinal.
        players:
          type: integer
          description: Nominal participant count; observed almost always 0.
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - _id
        - title
        - index
        - players
        - startDate
        - endDate
        - createdAt
        - updatedAt
    SeasonsCurrentResponse:
      allOf:
        - type: object
          properties:
            ok:
              type: integer
              const: 1
              description: "Success marker; every JSON success body carries `ok: 1`."
            rank:
              type: integer
              description: The caller's current ranking on the seasonal leaderboard.
          required:
            - ok
            - rank
        - $ref: "#/components/schemas/SeasonalWorldCompetition"
    SeasonsListResponse:
      type: object
      properties:
        ok:
          type: integer
          const: 1
          description: "Success marker; every JSON success body carries `ok: 1`."
        list:
          type: array
          items:
            $ref: "#/components/schemas/SeasonalWorldCompetition"
          description: Past, current and upcoming competitions by `index` ascending.
      required:
        - ok
        - list
    ShardName:
      type: string
      examples:
        - shard3
    UserBadge:
      type: object
      description: Player badge (`users.badge`) used to render the player icon.
      properties:
        type:
          description: Standard badge shape number, or the custom SVG path pair of a premium/custom badge.
          anyOf:
            - type: integer
            - $ref: "#/components/schemas/UserBadgeCustomPaths"
        color1:
          $ref: "#/components/schemas/UserBadgeColor"
        color2:
          $ref: "#/components/schemas/UserBadgeColor"
        color3:
          $ref: "#/components/schemas/UserBadgeColor"
        param:
          type: number
          description: Shape parameter; submissions are limited to -100..100.
        flip:
          type: boolean
          description: Mirror/rotate the shape according to its flip rule.
        decoration:
          type: string
          description: screeps.com decoration id of a non-standard badge (official client type; not produced
            by OpenScreeps).
      required:
        - type
        - color1
        - color2
        - color3
        - param
        - flip
    UserBadgeColor:
      description: Badge color. Submitted badges use `#rrggbb`; stored badges may also contain an integer
        index into the legacy badge palette (OpenScreeps `readBadge` accepts both; the official
        client types colors as strings).
      anyOf:
        - type: string
        - type: integer
          minimum: 0
    UserBadgeCustomPaths:
      type: object
      description: Pair of SVG path strings composing a custom (decoration-derived on screeps.com,
        administrator-assigned on OpenScreeps) badge shape.
      properties:
        path1:
          type: string
          description: SVG path data filled with `color2`.
        path2:
          type: string
          description: SVG path data filled with `color3`; may be empty.
      required:
        - path1
        - path2
    UserBadgeDecoration:
      type: object
      description: Premium badge decoration (screeps.com).
      properties:
        _id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        rarity:
          type: integer
          minimum: 1
          maximum: 5
          description: 1 (common) to 5 (rarest).
        rarityMultiplier:
          type: number
        group:
          type: string
        groupDescription:
          type:
            - string
            - "null"
        theme:
          type: string
          description: Theme id.
        preview:
          type: object
          properties:
            original:
              type: string
            128x128:
              type: string
            256x256:
              type: string
          description: Preview image URLs.
        steam:
          type: number
        steamItemDefId:
          type: number
        __v:
          type: number
        type:
          type: string
          const: badge
        badge:
          $ref: "#/components/schemas/UserBadgeCustomPaths"
      required:
        - _id
        - name
        - rarity
        - group
        - groupDescription
        - theme
        - preview
        - steam
        - steamItemDefId
        - __v
        - type
        - badge
    UserBadgeInput:
      type: object
      description: Badge submitted to `POST /api/user/badge`. Colors must be `#rrggbb`; `type` must be an
        integer 1-24 or exactly equal the caller's assigned custom badge paths, otherwise the server
        answers `invalid params`.
      properties:
        type:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 24
            - $ref: "#/components/schemas/UserBadgeCustomPaths"
        color1:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        color2:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        color3:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        param:
          description: Numeric shape parameter -100..100. Servers coerce with JavaScript `Number()`/unary `+`,
            so numeric strings are accepted.
          anyOf:
            - type: number
              minimum: -100
              maximum: 100
            - type: string
        flip:
          type: boolean
          description: Coerced to boolean by the server; defaults to false.
      required:
        - type
        - color1
        - color2
        - color3
        - param
    UserBadgeSetRequest:
      type: object
      properties:
        badge:
          $ref: "#/components/schemas/UserBadgeInput"
      required:
        - badge
    UserBranchesResponse:
      type: object
      properties:
        ok:
          type: integer
          const: 1
          description: "Success marker; every JSON success body carries `ok: 1`."
        list:
          type: array
          items:
            $ref: "#/components/schemas/UserCodeBranch"
      required:
        - ok
        - list
    UserCloneBranchRequest:
      type: object
      properties:
        branch:
          type: string
          maxLength: 30
          description: 'Source branch name. Empty/omitted, or a name that does not exist, falls back to
            `defaultModules` or `{main: ""}`.'
        newName:
          type: string
          minLength: 1
          maxLength: 30
          description: Target branch name. OpenScreeps rejects names starting with `$`. If the branch exists
            its modules are overwritten.
        defaultModules:
          $ref: "#/components/schemas/UserCodeModules"
      required:
        - newName
    UserCodeBranch:
      type: object
      description: Code branch document (`users.code`). The official client types only `_id`, `branch`,
        `activeWorld`, `activeSim`; OpenScreeps and backend-local return the whole document
        including `user`, `modules` and `timestamp`.
      properties:
        _id:
          type: string
        user:
          $ref: "#/components/schemas/UserId"
        branch:
          type: string
          description: Branch name.
        modules:
          $ref: "#/components/schemas/UserCodeModules"
        activeWorld:
          type: boolean
          description: Branch runs in the world. Absent on branches created by cloning until activated.
        activeSim:
          type: boolean
          description: Branch runs in the simulator. Absent on branches created by cloning until activated.
        timestamp:
          description: "Last code change. OpenScreeps: Unix milliseconds, absent until code is first saved;
            backend-local may store a Date (serialized as an ISO string)."
          anyOf:
            - type: integer
            - type: string
              format: date-time
      required:
        - _id
        - branch
    UserCodeGetResponse:
      type: object
      properties:
        ok:
          type: integer
          const: 1
          description: "Success marker; every JSON success body carries `ok: 1`."
        branch:
          type: string
          description: Resolved branch name.
        modules:
          $ref: "#/components/schemas/UserCodeModules"
      required:
        - ok
        - branch
        - modules
    UserCodeModules:
      type: object
      description: "Code modules keyed by module name: JavaScript source text or `{binary}` WebAssembly.
        Servers drop module names starting with `$`, `.`, `/` or `\\` (OpenScreeps also `__proto__`)
        and always ensure a `main` module exists."
      additionalProperties:
        anyOf:
          - type: string
          - $ref: "#/components/schemas/UserCodeWasmModule"
    UserCodeSetRequest:
      type: object
      properties:
        branch:
          type: string
          description: Branch name, or `$activeWorld` / `$activeSim` to select the branch active in the world
            / simulator. Empty or omitted selects `$activeWorld`.
        modules:
          $ref: "#/components/schemas/UserCodeModules"
        _hash:
          description: Opaque client hash echoed in the `user:<id>/code` realtime event (string or number on
            OpenScreeps).
          anyOf:
            - type: string
            - type: number
      required:
        - modules
    UserCodeWasmModule:
      type: object
      description: Binary (WebAssembly) module.
      properties:
        binary:
          type: string
          contentEncoding: base64
          description: Base64-encoded module bytes.
      required:
        - binary
    UserConsoleCommandDoc:
