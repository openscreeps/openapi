openapi: 3.1.0
info:
  title: Screeps World and OpenScreeps HTTP API
  version: 0.1.0
  summary: Source-derived contracts with explicit server compatibility
  description: "Community-maintained HTTP contracts, not an official Screeps specification. Coverage
    is pinned to sources.json and coverage.json. Each operation declares x-availability and cites
    source evidence. A supported marker means the pinned implementation or reference client
    documents the operation, not that every operation was exercised live. Shapes shared by differing
    implementations are unions; read x-compatibility and descriptions before using a server-specific
    field. WebSocket/SockJS channels and the in-game JavaScript API are not HTTP operations and are
    outside this document. Never infer gameplay success from HTTP 200: inspect error and ok.
    Endpoints can have destructive effects; specification examples are not authorization to invoke
    them."
  contact:
    name: OpenScreeps
    url: https://github.com/openscreeps/openapi/issues
  license:
    name: ISC
    identifier: ISC
servers:
  - url: https://screeps.com
    description: Official Screeps World; shard query/body fields route shard-specific operations.
  - url: http://{host}:{port}
    description: OpenScreeps standalone server; configure host and port for your deployment. Check
      x-availability before calling.
    variables:
      host:
        default: localhost
        description: Your standalone server hostname or IP address.
      port:
        default: "21025"
        description: The standalone server HTTP port.
externalDocs:
  description: Pinned source provenance, coverage and compatibility policy
  url: https://github.com/openscreeps/openapi#coverage-and-evidence
paths:
  /:
    get:
      operationId: platformRoot
      summary: Read standalone landing page
      description: OpenScreeps static landing page for game clients. This operation does not describe the
        official Screeps web application.
      tags:
        - Platform
      security: []
      parameters: []
      responses:
        "200":
          description: HTML landing page.
          content:
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
      x-availability:
        screeps-com: unsupported
        openscreeps: supported
      x-sources:
        - https://github.com/openscreeps/server/blob/3954fd26f107a4b508ccaf6b5f64e4aa951d9e91/src/http.ts#L29-L37
  /admin:
    post:
      operationId: adminCommand
      summary: Execute an administrative command
      description: OpenScreeps-only operator command dispatch. Unknown fields are rejected; each mutation
        is serialized and durably committed. The request action discriminates the command shapes
        below. Several actions delete or replace world/player data, change resources or publish to
        players. Do not invoke them without explicit operator authorization. Domain validation
        failures use HTTP 400 here, not the gameplay HTTP-200 error envelope.
      tags:
        - Administration
      security:
        - AdminToken: []
      parameters: []
      responses:
        "200":
          description: Successful administrative result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Missing administrator bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Admin API disabled, wrong secret, or protected system user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Requested player, room or bot not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/ServerError"
      x-availability:
        screeps-com: unsupported
        openscreeps: supported
      x-sources:
        - https://github.com/openscreeps/server/blob/3954fd26f107a4b508ccaf6b5f64e4aa951d9e91/src/admin.ts#L27-L79
        - https://github.com/openscreeps/server/blob/3954fd26f107a4b508ccaf6b5f64e4aa951d9e91/src/services/admin.service.ts#L406-L669
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCommand"
  /admin/status:
    get:
      operationId: adminStatus
      summary: Read operator status
      description: OpenScreeps-only administrative endpoint. Requires the separately configured
        administrator bearer secret, never a player token. Disabled with 403 when no sufficiently
        long secret is configured.
      tags:
        - Administration
      security:
        - AdminToken: []
      parameters: []
      responses:
        "200":
          description: Successful administrative result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Missing administrator bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Admin API disabled, wrong secret, or protected system user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Requested player, room or bot not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/ServerError"
      x-availability:
        screeps-com: unsupported
        openscreeps: supported
      x-sources:
        - https://github.com/openscreeps/server/blob/3954fd26f107a4b508ccaf6b5f64e4aa951d9e91/src/admin.ts#L27-L64
        - https://github.com/openscreeps/server/blob/3954fd26f107a4b508ccaf6b5f64e4aa951d9e91/src/services/admin.service.ts#L355-L383
  /api/auth/me:
    get:
      operationId: authMe
      summary: Get the authenticated account
      description: "Returns the private profile of the account owning the token: id, username, e-mail,
        CPU, badge, GCL/power progress, credit balance (`money`), notification preferences, linked
        Steam data and power-creep experimentation state. screeps.com additionally returns shard CPU
        limits (`cpuShard`, `cpuShardUpdatedTime`), account resources, SSO links and legacy fields;
        OpenScreeps never returns those and instead mirrors the backend-local projection
        (`emailDirty`, `lastChargeTime`, `blocked`, `customBadge`). Only fields present in storage
        are serialized. The official client uses this endpoint only for full-access tokens;
        restricted tokens resolve the user through `GET /api/user/name` + `GET /api/user/find`."
      tags:
        - Auth
      security:
        - Token: []
      responses:
        "200":
          description: Success, or a logical error in the HTTP 200 `{error}` envelope.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AuthMeResponse"
                  - $ref: "#/components/schemas/ApiError"
          headers:
            X-Token:
              description: Refreshed session token when issued by the server. Retain it for subsequent
                authenticated requests.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      x-availability:
        screeps-com: supported
        openscreeps: supported
      x-observations:
        - url: https://screeps.com/api/auth/me
          date: 2026-10-10
          notes: Authenticated read-only response represents steam.ownership as an array of integer Steam
            application IDs, unlike the standalone boolean. No account identifiers or credentials
            are recorded.
      x-sources:
        - https://github.com/openscreeps/server/blob/3954fd26f107a4b508ccaf6b5f64e4aa951d9e91/src/api/accounts.ts#L12-L16
        - https://github.com/openscreeps/server/blob/3954fd26f107a4b508ccaf6b5f64e4aa951d9e91/src/services/accounts.ts#L135-L167
        - https://github.com/screepers/node-screeps-api/blob/0f861874ff119b7ba37d0d1a4beb90f096209f4e/src/ScreepsHttpClient.ts#L446-L454
        - https://github.com/screepers/node-screeps-api/blob/0f861874ff119b7ba37d0d1a4beb90f096209f4e/src/http/auth.ts#L15-L74
        - https://github.com/screeps/backend-local/blob/9d079282303ec04e577ac2bb97f64312b25e4ccd/lib/game/api/auth.js#L111-L135
        - https://github.com/openscreeps/server/blob/3954fd26f107a4b508ccaf6b5f64e4aa951d9e91/src/api/transport.ts#L113-L158
        - https://github.com/screepers/node-screeps-api/blob/0f861874ff119b7ba37d0d1a4beb90f096209f4e/src/ScreepsHttpClient.ts#L2168-L2179
        - https://github.com/openscreeps/server/blob/3954fd26f107a4b508ccaf6b5f64e4aa951d9e91/src/api/transport.ts#L67-L73
      x-compatibility:
        openscreeps: "Token may be sent as `X-Token`, `Authorization: Bearer`, or `?token=`; each
          authenticated call issues a fresh token in the `X-Token` response header (default lifetime
          60 s)."
        screeps-com: Fields such as cpuShard, resources, github/twitter are typed by the official client only.
      parameters:
        - $ref: "#/components/parameters/ServerPassword"
        - $ref: "#/components/parameters/LegacyUsername"
  /api/auth/query-token:
    get:
      operationId: authQueryToken
      summary: Inspect an API token
      description: "Returns the permissions of a screeps.com account auth token: whether it has full
        access, or the REST endpoints and WebSocket channel groups it is restricted to, plus its
        description. The official client calls it to decide between `GET /api/auth/me` and the
        restricted `GET /api/user/name` lookup. Unrecognized tokens produce an HTTP error. Not
        implemented by OpenScreeps or backend-local, which issue only short-lived full-access
        session tokens."
      tags:
        - Auth
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: The API token to inspect.
          schema:
            type: string
      responses:
        "200":
          description: Success, or a logical error in the HTTP 200 `{error}` envelope.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AuthQueryTokenResponse"
                  - $ref: "#/components/schemas/ApiError"
        "404":
          description: "Route not implemented (OpenScreeps answers Nest's `{message, error: \"Not Found\",
            statusCode: 404}`; the official client documents HTTP 404 on unofficial servers for
            official-only routes)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-availability:
        screeps-com: supported
        openscreeps: unsupported
      x-sources:
        - https://github.com/screepers/node-screeps-api/blob/0f861874ff119b7ba37d0d1a4beb90f096209f4e/src/ScreepsHttpClient.ts#L456-L467
        - https://github.com/screepers/node-screeps-api/blob/0f861874ff119b7ba37d0d1a4beb90f096209f4e/src/http/auth.ts#L76-L84
        - https://github.com/screepers/node-screeps-api/blob/0f861874ff119b7ba37d0d1a4beb90f096209f4e/src/http/auth.ts#L86-L104
        - https://github.com/screepers/node-screeps-api/blob/0f861874ff119b7ba37d0d1a4beb90f096209f4e/src/ScreepsHttpClient.ts#L2185-L2203
      x-compatibility:
        screeps-com: The client sends the token only as a query parameter (plus its configured `X-Token`);
          whether the endpoint itself requires `X-Token` is unverified.
  /api/auth/signin:
    post:
      operationId: authSignin
      summary: Sign in with password
      description: Exchanges local credentials for a session token. The `email` field carries an e-mail
        address or, on OpenScreeps, a username (looked up case-insensitively unless it contains
        `@`). OpenScreeps verifies scrypt hashes in constant time (unknown accounts still hash a
        dummy) and answers every failure with HTTP 401 `unauthorized`; accounts without a configured
        password cannot sign in. The official client notes that password sign-in has not worked on
        screeps.com since 2018 (use account auth tokens there); it remains the authentication method
        for private servers.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSigninRequest"
      responses:
        "200":
          description: Success, or a logical error in the HTTP 200 `{error}` envelope.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AuthSigninResponse"
                  - $ref: "#/components/schemas/ApiError"
        "400":
          description: "OpenScreeps: malformed JSON (`invalid request`) or a body that is not a JSON object
            (`invalid params`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing/invalid credentials (`unauthorized`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: "OpenScreeps: JSON body larger than 8 MB (`request too large`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/ServerError"
      x-availability:
        screeps-com: unsupported
        openscreeps: supported
      x-sources:
        - https://github.com/openscreeps/server/blob/3954fd26f107a4b508ccaf6b5f64e4aa951d9e91/src/api/accounts.ts#L18-L22
        - https://github.com/openscreeps/server/blob/3954fd26f107a4b508ccaf6b5f64e4aa951d9e91/src/services/accounts.ts#L169-L183
        - https://github.com/openscreeps/server/blob/3954fd26f107a4b508ccaf6b5f64e4aa951d9e91/src/api/auth.ts#L66-L87
        - https://github.com/screepers/node-screeps-api/blob/0f861874ff119b7ba37d0d1a4beb90f096209f4e/src/ScreepsHttpClient.ts#L416-L429
        - https://github.com/screepers/node-screeps-api/blob/0f861874ff119b7ba37d0d1a4beb90f096209f4e/src/http/auth.ts#L6-L13
      x-compatibility:
        backend-local: The pinned backend-local has no signin route (provided by auth mods on private servers).
      parameters:
        - $ref: "#/components/parameters/ServerPassword"
  /api/auth/steam-ticket:
    post:
      operationId: authSteamTicket
      summary: Sign in with a Steam session ticket
      description: Verifies a Steam session ticket and returns a session token plus the authenticated
        SteamID, creating a new account (no username, 100 CPU, default code branch, empty Memory)
        the first time a SteamID signs in. OpenScreeps verifies the ticket with the Steam Web API
        `ISteamUserAuth/AuthenticateUserTicket` (app 464350) using the operator-configured Steam Web
        API key, outside the world lock and with a 10 s timeout; without a configured key, or when
        `useNativeAuth` is truthy, it answers `authentication method is not supported`. Any
        verification failure yields `could not authenticate`. The official client documents Steam
        (and GitHub) SSO as the only sign-in methods on screeps.com but does not type the response.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSteamTicketRequest"
      responses:
        "200":
          description: "Success, or a logical error in the HTTP 200 `{error}` envelope. Known `error` values:
            `authentication method is not supported`, `could not authenticate`."
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AuthSteamTicketResponse"
                  - $ref: "#/components/schemas/ApiError"
        "400":
          description: "OpenScreeps: malformed JSON (`invalid request`) or a body that is not a JSON object
            (`invalid params`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: "OpenScreeps: JSON body larger than 8 MB (`request too large`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      x-availability:
        screeps-com: supported
        openscreeps: supported
      x-sources:
        - https://github.com/openscreeps/server/blob/3954fd26f107a4b508ccaf6b5f64e4aa951d9e91/src/api/accounts.ts#L24-L28
        - https://github.com/openscreeps/server/blob/3954fd26f107a4b508ccaf6b5f64e4aa951d9e91/src/services/accounts.ts#L185-L199
        - https://github.com/openscreeps/server/blob/3954fd26f107a4b508ccaf6b5f64e4aa951d9e91/src/api/auth.ts#L94-L125
        - https://github.com/screepers/node-screeps-api/blob/0f861874ff119b7ba37d0d1a4beb90f096209f4e/src/ScreepsHttpClient.ts#L431-L444
        - https://github.com/screeps/backend-local/blob/9d079282303ec04e577ac2bb97f64312b25e4ccd/lib/game/api/auth.js#L137-L178
      x-compatibility:
        screeps-com: Response typed `ScreepsUnknownResponse` by the official client; token/steamid fields
          are from backend-local/OpenScreeps.
        backend-local: Also supports Greenworks encrypted app tickets when started in native-auth mode
          (`invalid encrypted ticket`).
      parameters:
        - $ref: "#/components/parameters/ServerPassword"
  /api/experimental/nukes:
    get:
      operationId: platformExperimentalNukes
      summary: List active nuclear launches
      description: Experimental official endpoint returning raw nuke objects grouped by shard. Read-only;
        it does not launch a nuke. OpenScreeps does not implement it.
      tags:
        - Platform
      security: []
      parameters: []
      responses:
        "200":
          description: Successful result or logical API failure. Inspect error even on HTTP 200.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      ok:
                        type: integer
                        const: 1
                      nukes:
                        type: object
                        additionalProperties:
                          type: array
                          items:
                            $ref: "#/components/schemas/PlatformNuke"
                    required:
                      - ok
                      - nukes
                    additionalProperties: true
                  - $ref: "#/components/schemas/ApiError"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
      x-availability:
        screeps-com: supported
        openscreeps: unsupported
      x-sources:
        - https://github.com/screepers/node-screeps-api/blob/0f861874ff119b7ba37d0d1a4beb90f096209f4e/src/ScreepsHttpClient.ts#L1817-L1825
        - https://github.com/screepers/node-screeps-api/blob/0f861874ff119b7ba37d0d1a4beb90f096209f4e/src/http/experimental.ts#L26-L34
        - https://github.com/screepers/node-screeps-api/blob/0f861874ff119b7ba37d0d1a4beb90f096209f4e/src/common/rooms.ts#L646-L652
  /api/experimental/pvp:
    get:
      operationId: platformExperimentalPvp
      summary: Find recently active combat rooms
      description: Experimental official endpoint, including attacks against NPCs. The client defaults
        interval to 100; its documentation does not establish precise interval units or filtering
        direction. OpenScreeps does not implement this route.
      tags:
        - Platform
      security: []
      parameters:
        - name: interval
          in: query
          required: false
          schema:
            type: integer
            default: 100
          description: Experimental filter; reference client default is 100; precise upstream units are
            undocumented.
      responses:
        "200":
          description: Successful result or logical API failure. Inspect error even on HTTP 200.
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      ok:
                        type: integer
                        const: 1
                      pvp:
                        type: object
                        additionalProperties:
                          $ref: "#/components/schemas/PlatformPvpShard"
                    required:
                      - ok
                      - pvp
                    additionalProperties: true
                  - $ref: "#/components/schemas/ApiError"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
      x-availability:
        screeps-com: supported
        openscreeps: unsupported
      x-sources:
        - https://github.com/screepers/node-screeps-api/blob/0f861874ff119b7ba37d0d1a4beb90f096209f4e/src/ScreepsHttpClient.ts#L1805-L1815
        - https://github.com/screepers/node-screeps-api/blob/0f861874ff119b7ba37d0d1a4beb90f096209f4e/src/http/experimental.ts#L4-L24
  /api/game/add-global-intent:
    post:
      operationId: gameAddGlobalIntent
      summary: Queue a manual global intent
      description: Queues one account-level intent (market orders, deals, power creep management) for the
        next tick, as if issued by the caller's script. The payload is wrapped in a one-element list
        and sanitized with the engine intent table; unknown names queue nothing but still succeed.
        On OpenScreeps successive calls append to the caller's pending global intent lists, which
        the next tick merges into the caller's script intents; backend-local inserts one
        `users.intents` document per call. Not called by the official client.
      tags:
        - Game
      security:
        - Token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameAddGlobalIntentRequest"
      responses:
        "200":
          description: Intent queued. Logical failures are reported with HTTP 200 and `{error}`.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/Ok"
                  - $ref: "#/components/schemas/ApiError"
          headers:
            X-Token:
              description: Refreshed session token when issued by the server. Retain it for subsequent
                authenticated requests.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      x-availability:
        screeps-com: unverified
        openscreeps: supported
      x-sources:
        - https://github.com/openscreeps/server/blob/3954fd26f107a4b508ccaf6b5f64e4aa951d9e91/src/api/game.ts#L120-L124
        - https://github.com/openscreeps/server/blob/3954fd26f107a4b508ccaf6b5f64e4aa951d9e91/src/services/game.ts#L249-L256
        - https://github.com/openscreeps/game/blob/fd9cde57de20a1e37a0108c46ca78314c8b9bc36/src/domain/intents.ts#L206-L224
        - https://github.com/openscreeps/engine/blob/55883bef45d0d1c3c8c16e497fca56fe0b43ff11/src/utils/system.ts#L88-L188
        - https://github.com/openscreeps/engine/blob/55883bef45d0d1c3c8c16e497fca56fe0b43ff11/src/utils/system.ts#L65-L82
        - https://github.com/screeps/backend-local/blob/9d079282303ec04e577ac2bb97f64312b25e4ccd/lib/game/api/game.js#L714-L720
        - https://github.com/openscreeps/engine/blob/55883bef45d0d1c3c8c16e497fca56fe0b43ff11/src/simulation/global/market.ts#L188-L388
        - https://github.com/openscreeps/engine/blob/55883bef45d0d1c3c8c16e497fca56fe0b43ff11/src/simulation/global/power.ts#L22-L40
        - https://github.com/openscreeps/engine/blob/55883bef45d0d1c3c8c16e497fca56fe0b43ff11/src/simulation/global/account.ts#L29-L57
      x-compatibility:
        backend-local: "Responds with `{ok: 1}` extended with the inserted `users.intents` document
          (q-json-response `_.extend({ok: 1}, data)`); accepts mod `customIntentTypes`."
        openscreeps: Drops `generatePixel`, `unlockCpu` and `activateAccess` (only the player runtime may
          record them).
      parameters:
        - $ref: "#/components/parameters/ServerPassword"
        - $ref: "#/components/parameters/LegacyUsername"
  /api/game/add-object-intent:
    post:
      operationId: gameAddObjectIntent
      summary: Queue a manual object or room intent
      description: "Queues a manual intent for the next tick, executed as if issued by the caller's script
        (e.g. `suicide`, `unclaim`, `activateSafeMode`, `notifyWhenAttacked`, room-level
        `destroyStructure`/`removeConstructionSite`/`removeFlag`). The target room must exist, be a
        world room (`W…`/`E…`, otherwise `not supported`), and be inside the borders and open (`out
        of borders`). `activateSafeMode` is refused while any of the caller's controllers has active
        safe mode (`safe mode active already`). The payload is sanitized with the engine intent
        table (only schema fields kept; unknown names store `{}`), merged into the caller's queued
        manual intents for that target (`$merge`: objects deep-merge, arrays merge index by index),
