        - value
      additionalProperties: true
    GameMapStatsRequest:
      type: object
      required:
        - rooms
        - statName
      properties:
        rooms:
          type: array
          items:
            type: string
          description: Room names. OpenScreeps ignores non-string items and rooms without a room document.
        statName:
          type: string
          pattern: ^.*?[0-9]+$
          description: Statistic name suffixed with an interval, matched by `/^(.*?)(\d+)$/`. `owner0` and
            `claim0` request only ownership data; `<GameRoomStatName><8|180|1440>` (e.g.
            `energyHarvested8`) additionally ranks players on OpenScreeps.
          examples:
            - owner0
            - claim0
            - energyHarvested8
            - creepsLost180
        shard:
          allOf:
            - $ref: "#/components/schemas/ShardName"
          description: Official shard routing. The official client sends `shard` inside the JSON body for POST
            operations; OpenScreeps is single-world and ignores it.
    GameMapStatsResponse:
      allOf:
        - $ref: "#/components/schemas/Ok"
        - type: object
          properties:
            gameTime:
              type: integer
              description: Current game tick.
            stats:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/GameMapStatsRoom"
              description: Stats keyed by room name; requested rooms without a room document are absent.
            statsMax:
              type: object
              additionalProperties:
                type: number
              description: Largest ranked value keyed by `statName` (OpenScreeps); always `{}` on backend-local.
            users:
              $ref: "#/components/schemas/GamePublicUsers"
          additionalProperties: true
          required:
            - gameTime
            - stats
            - statsMax
            - users
    GameMapStatsRoom:
      description: Per-room map stats. Room-status fields are copied from the room document; `own`,
        `sign`, `safeMode` and `minerals0` come from room objects; the requested `statName` key
        (e.g. `energyHarvested8`) holds the ranking for that stat. OpenScreeps fills the ranking as
        an array sorted by value descending; backend-local never fills it; the official client types
        it as a single `{user, value}` object.
      type: object
      properties:
        status:
          type: string
        novice:
          type:
            - number
            - "null"
        respawnArea:
          type:
            - number
            - "null"
        openTime:
          type:
            - number
            - "null"
        own:
          type: object
          description: "Controller owner (`level` = RCL), reserver (`level: 0`), or an invader core with level
            > 0 (`user` omitted on OpenScreeps when the core has no user)."
          properties:
            user:
              $ref: "#/components/schemas/UserId"
            level:
              type: integer
          required:
            - level
          additionalProperties: true
        sign:
          $ref: "#/components/schemas/GameControllerSign"
        hardSign:
          allOf:
            - $ref: "#/components/schemas/GameControllerSign"
          description: System sign, typed by the official client only.
        safeMode:
          type: boolean
          const: true
          description: Present when the controller's safe mode ends after the current game time.
        minerals0:
          type: object
          properties:
            type:
              type: string
              description: Mineral resource type.
            density:
              type: integer
          additionalProperties: true
      additionalProperties:
        anyOf:
          - type: array
            items:
              $ref: "#/components/schemas/GameMapStatEntry"
          - $ref: "#/components/schemas/GameMapStatEntry"
    GamePlaceSpawnRequest:
