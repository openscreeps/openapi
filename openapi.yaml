              properties:
                unstableDate:
                  type: integer
                  minimum: 0
                  maximum: 8640000000000000
                decayTime:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
              required: []
              additionalProperties: false
          required:
            - action
            - from
            - to
          additionalProperties: false
          description: Create a paired portal between rooms.
        - type: object
          properties:
            action:
              type: string
              const: terminal-create
            room:
              type: string
              minLength: 1
              maxLength: 16
              pattern: ^[WE][0-9]{1,3}[NS][0-9]{1,3}$
          required:
            - action
            - room
          additionalProperties: false
          description: Create an NPC terminal in an existing room.
        - type: object
          properties:
            action:
              type: string
              const: bot-add
