name: Check specification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v5
        with:
          repository: openscreeps/server
          ref: 3954fd26f107a4b508ccaf6b5f64e4aa951d9e91
          path: .sources/server
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: screepers/node-screeps-api
          ref: 0f861874ff119b7ba37d0d1a4beb90f096209f4e
          path: .sources/client
          persist-credentials: false
      - run: node scripts/inventory.mjs --check
      - run: npm run check
      - run: npm run format:check
      - run: npm run types
