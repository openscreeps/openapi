name: Check specification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.21.0
          cache: npm
      # Do not let prepare regenerate tracked files before stale-output checks.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run format:check
      - run: npm pack --ignore-scripts --dry-run
